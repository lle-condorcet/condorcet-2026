# Configuration SonarQube pour un projet .NET
# =============================================

# Cle unique du projet dans SonarQube
sonar.projectKey=my-dotnet-project

# Nom affiche dans l'interface SonarQube
sonar.projectName=Mon Projet .NET

# Version du projet
sonar.projectVersion=1.0

# URL du serveur SonarQube
sonar.host.url=http://localhost:9000

# Token d'authentification (a remplacer par votre token)
# sonar.token=sqp_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx

# Chemin des sources
sonar.sources=.

# Exclusions (fichiers a ne pas analyser)
sonar.exclusions=**/bin/**,**/obj/**,**/wwwroot/lib/**,**/Migrations/**,**/*.Designer.cs

# Encodage des fichiers sources
sonar.sourceEncoding=UTF-8

# Langue principale
sonar.language=cs
