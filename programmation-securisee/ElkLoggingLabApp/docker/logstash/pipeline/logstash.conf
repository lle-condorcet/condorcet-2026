input {
  # Receive logs via TCP (JSON format from Serilog)
  tcp {
    port => 5000
    codec => json_lines
  }

  # Receive logs via UDP
  udp {
    port => 5000
    codec => json_lines
  }

  # Beats input (for Filebeat if needed)
  beats {
    port => 5044
  }
}

filter {
  # Parse timestamp
  if [Timestamp] {
    date {
      match => ["Timestamp", "ISO8601"]
      target => "@timestamp"
    }
  }

  # Add log level field normalized
  if [Level] {
    mutate {
      add_field => { "log_level" => "%{Level}" }
    }
    mutate {
      lowercase => ["log_level"]
    }
  }

  # Tag security events
  if [MessageTemplate] =~ /SECURITY/ {
    mutate {
      add_tag => ["security_event"]
    }
  }

  # Tag slow queries
  if [MessageTemplate] =~ /SLOW/ {
    mutate {
      add_tag => ["slow_query"]
    }
  }

  # Tag audit events
  if [MessageTemplate] =~ /AUDIT/ {
    mutate {
      add_tag => ["audit_event"]
    }
  }

  # Extract correlation ID if present in properties
  if [Properties][CorrelationId] {
    mutate {
      add_field => { "correlation_id" => "%{[Properties][CorrelationId]}" }
    }
  }

  # Parse HTTP method and status from structured log properties
  if [Properties][Method] {
    mutate {
      add_field => { "http_method" => "%{[Properties][Method]}" }
    }
  }

  if [Properties][StatusCode] {
    mutate {
      add_field => { "http_status" => "%{[Properties][StatusCode]}" }
    }
  }

  if [Properties][Duration] {
    mutate {
      add_field => { "request_duration_ms" => "%{[Properties][Duration]}" }
    }
    mutate {
      convert => { "request_duration_ms" => "float" }
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "elklab-logs-%{+YYYY.MM.dd}"
  }

  # Debug output to stdout (remove in production)
  stdout {
    codec => rubydebug
  }
}
